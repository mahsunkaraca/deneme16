<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="Mahsun Karaca — oyunlar, yayınlar ve tüm sosyal hesaplarım tek yerde.">
  <title>Mahsun Karaca · Oyuna katıl</title>
  <style>
    :root { color-scheme: dark; --bg:#0b0d12; --text:#f1f3f7; --muted:#858b9b; --lime:#c3ff5d; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Arial,Helvetica,sans-serif; min-height:100vh; }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse at 50% 0%,#c3ff5d0d,transparent 52%),linear-gradient(#ffffff03 1px,transparent 1px),linear-gradient(90deg,#ffffff03 1px,transparent 1px); background-size:auto,48px 48px,48px 48px; }
    main { position:relative; width:min(100% - 40px,480px); margin:0 auto; padding:36px 0 24px; }
    .topline { display:flex; justify-content:space-between; align-items:center; font-family:monospace; font-size:10px; letter-spacing:2px; color:var(--muted); }
    .mark { color:var(--lime); font-weight:700; font-size:14px; letter-spacing:-1px; }
    header { text-align:center; padding:46px 0 30px; }
    .avatar { width:94px; height:94px; margin:0 auto 23px; border:1px solid #c3ff5d66; border-radius:28px; background:linear-gradient(145deg,#293522,#131a13); display:grid; place-items:center; position:relative; box-shadow:0 0 45px #c3ff5d0b; }
    .avatar span { font-size:35px; font-weight:900; letter-spacing:-4px; padding-right:4px; color:var(--lime); transform:skew(-9deg); }
    .avatar::after { content:"✦"; position:absolute; right:-9px; bottom:-7px; width:27px; height:27px; border:4px solid var(--bg); background:var(--lime); color:#10150a; border-radius:50%; font-size:15px; display:grid; place-items:center; }
    .eyebrow { color:var(--lime); font-family:monospace; font-size:10px; letter-spacing:3px; text-transform:uppercase; }
    h1 { font-size:clamp(30px,7vw,39px); letter-spacing:-1.8px; margin:12px 0 10px; }
    .bio { color:#a1a7b5; font-size:14px; line-height:1.7; margin:0; }
    .tags { display:flex; justify-content:center; gap:7px; margin-top:19px; }
    .tag { padding:5px 9px; border:1px solid #282c35; border-radius:5px; color:#a1a7b5; font-family:monospace; font-size:10px; }
    .section-label { display:flex; justify-content:space-between; margin:13px 0 12px; color:var(--muted); font-family:monospace; font-size:10px; letter-spacing:1.6px; }
    .links { display:grid; gap:10px; }
    .link { display:flex; align-items:center; gap:15px; width:100%; padding:17px; text-align:left; border:1px solid #292d36; border-radius:13px; background:#14171ee8; color:var(--text); font:inherit; opacity:1; }
    .link.featured { background:linear-gradient(110deg,#222d19,#171d14); border-color:#c3ff5d45; }
    .icon { display:grid; place-items:center; flex:0 0 42px; height:42px; border-radius:10px; background:#ffffff06; color:var(--accent); }
    svg { width:23px; height:23px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .copy { flex:1; }
    .copy strong { display:block; font-size:14px; font-weight:600; }
    .copy small { display:block; margin-top:5px; font-size:11px; color:var(--muted); }
    .soon { font-family:monospace; font-size:9px; letter-spacing:1px; color:#a2a897; padding:5px 7px; border:1px solid #ffffff12; border-radius:4px; }
    .note { display:flex; align-items:center; justify-content:center; gap:8px; margin:23px 0 0; color:var(--muted); font-size:11px; }
    .dot { width:5px; height:5px; border-radius:50%; background:var(--lime); }
    footer { margin-top:38px; padding-top:20px; border-top:1px solid #ffffff0b; display:flex; justify-content:space-between; font-family:monospace; font-size:9px; letter-spacing:1px; color:#656b78; }
    footer span:last-child { color:var(--lime); }
    @media (max-width:360px) { main { width:calc(100% - 28px); } .link { padding:13px; gap:10px; } .soon { font-size:8px; } }
  </style>
</head>
<body>
  <main>
    <div class="topline"><span class="mark">MK<span style="color:#747b69"> /</span></span><span>PLAYER PROFILE · 01</span></div>
    <header>

        <span class="copy"><strong>Twitch</strong><small>Bir sonraki yayında buluşalım.</small></span><span class="soon">YAKINDA</span>
      </button>

        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="m10 9 5 3-5 3z"/></svg></span>
        <span class="copy"><strong>YouTube</strong><small>En iyi anlar, tek bir yerde.</small></span><span class="soon">YAKINDA</span>
      </button>
      <button type="button" class="link" disabled style="--accent:#a7a0ff">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m8 5-3 1-3 12 5 2 2-3h6l2 3 5-2-3-12-3-1-1 2H9z"/><circle cx="8" cy="12" r="1"/><circle cx="16" cy="12" r="1"/><path d="M9 16h6"/></svg></span>
        <span class="copy"><strong>Discord</strong><small>Ekibin buluşma noktası.</small></span><span class="soon">YAKINDA</span>
      </button>
      <button type="button" class="link" disabled style="--accent:#f0a2cf">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></svg></span>
        <span class="copy"><strong>Instagram</strong><small>Oyunun dışındaki hayat.</small></span><span class="soon">YAKINDA</span>
      </button>
      <button type="button" class="link" disabled style="--accent:#7de2e2">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14 3v12a4 4 0 1 1-4-4M14 3c1 4 3 5 6 5M17 5v11a7 7 0 1 1-7-7"/></svg></span>
        <span class="copy"><strong>TikTok</strong><small>Kısa klipler, büyük anlar.</small></span><span class="soon">YAKINDA</span>
      </button>
    </section>
    <p class="note"><span class="dot" aria-hidden="true"></span>Bağlantılar çok yakında burada.</p>
    <footer><span>© MAHSUN KARACA</span><span>GL HF ↗</span></footer>
  </main>
</body>
</html>
